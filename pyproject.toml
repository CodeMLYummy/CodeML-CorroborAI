[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corroborai"
version = "1.0.0"
description = "CorroborAI — corroboration hybride (règles + IA) des données RH ↔ Temps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
app = ["streamlit>=1.36"]

[project.scripts]
corroborai = "corroborai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corroborai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
